name: Set up MoonBit (channel install)
description: >
  Install MoonBit from a moving release channel into a private root, then
  bundle core for the backends this repository builds.

  This deliberately tracks a channel rather than an immutable snapshot. The
  previous design pinned one moonc version and verified five SHA-256 digests
  before unpacking, which is the stronger integrity story in the abstract and
  the wrong trade here: MoonBit publishes fast, so the pin went two weeks stale
  and failed a PR for a core API that exists in every toolchain anyone would
  actually install. A pin that is routinely wrong is not a safety property, it
  is a maintenance tax that fails closed on the wrong thing.

  What replaces it is coverage rather than verification: CI runs the whole gate
  on both `latest` and `nightly`, and the run is green when either channel is
  fully green (see the `gate` job). A channel that breaks for reasons this
  repository does not own therefore reports without blocking, while a genuine
  regression -- which breaks both -- still stops the merge.

  Install still goes into an explicitly absent private root under the runner
  temporary directory, so a preinstalled toolchain or stale user state cannot
  enter the closure. Deliberately does NOT cache: a restored cache entry would
  defeat the point of tracking a channel.

inputs:
  channel:
    description: Release channel to install, "latest" (stable) or "nightly".
    required: true

runs:
  using: composite
  steps:
    - name: Set up MoonBit (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MOONBIT_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        case "$MOONBIT_CHANNEL" in
          latest|nightly) ;;
          *) echo "unsupported MoonBit channel: $MOONBIT_CHANNEL" >&2; exit 1 ;;
        esac
        toolchain="$RUNNER_TEMP/moonbit-toolchain"
        # absent by construction: never install over an existing root
        test ! -e "$toolchain" && test ! -L "$toolchain"
        mkdir -m 0700 "$toolchain"
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
        if [ "$MOONBIT_CHANNEL" = "latest" ]; then
          MOON_HOME="$toolchain" bash "$RUNNER_TEMP/install-moonbit.sh"
        else
          MOON_HOME="$toolchain" bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_CHANNEL"
        fi
        rm -f "$RUNNER_TEMP/install-moonbit.sh"
        ln -sfn moon "$toolchain/bin/moonx"
        echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
        echo "$toolchain/bin" >> "$GITHUB_PATH"
        # the official all-target, LLVM and wasm-gc bundle sequence, which the
        # fresh-agent preparer reproduces from the same pinned core inputs
        "$toolchain/bin/moon" -C "$toolchain/lib/core" bundle --warn-list -a --all
        "$toolchain/bin/moon" -C "$toolchain/lib/core" bundle --warn-list -a --target llvm
        "$toolchain/bin/moon" -C "$toolchain/lib/core" bundle --warn-list -a --target wasm-gc --quiet

    - name: Set up MoonBit (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MOONBIT_CHANNEL: ${{ inputs.channel }}
      run: |
        $ErrorActionPreference = "Stop"
        if ($env:MOONBIT_CHANNEL -notin @("latest", "nightly")) {
          throw "unsupported MoonBit channel: $env:MOONBIT_CHANNEL"
        }
        $toolchain = Join-Path $env:RUNNER_TEMP "moonbit-toolchain"
        if (Test-Path -LiteralPath $toolchain) {
          throw "MoonBit install root must be absent"
        }
        New-Item -Path $toolchain -ItemType Directory | Out-Null
        $env:MOON_HOME = $toolchain
        $installer = Join-Path $env:RUNNER_TEMP "install-moonbit.ps1"
        Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -OutFile $installer
        if ($env:MOONBIT_CHANNEL -eq "latest") {
          & powershell -ExecutionPolicy Bypass -File $installer
        } else {
          & powershell -ExecutionPolicy Bypass -File $installer $env:MOONBIT_CHANNEL
        }
        Remove-Item $installer -Force
        # the channel installer already provides moonx; only link if absent
        if (-not (Test-Path -LiteralPath "$toolchain\bin\moonx.exe")) {
          New-Item -ItemType HardLink -Path "$toolchain\bin\moonx.exe" -Value "$toolchain\bin\moon.exe" | Out-Null
        }
        & "$toolchain\bin\moon.exe" -C "$toolchain\lib\core" bundle --warn-list -a --all
        & "$toolchain\bin\moon.exe" -C "$toolchain\lib\core" bundle --warn-list -a --target wasm-gc --quiet
        "MOON_HOME=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$toolchain\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Recorded on every job so a candidate remains traceable to an exact
    # toolchain after the fact. Provenance by record, since there is no longer
    # a tracked digest to verify against before the fact.
    - name: MoonBit versions
      shell: bash
      run: moon version --all

    # Populate the module registry so dependency resolution works on a fresh
    # runner (all deps are first-party: moonbitlang/async and moonbitlang/x).
    - name: Resolve dependencies
      shell: bash
      run: moon update
