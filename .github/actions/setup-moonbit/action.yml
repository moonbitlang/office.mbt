name: Set up MoonBit (pinned nightly snapshot)
description: >
  Install the immutable MoonBit nightly snapshot named by the fresh-agent build
  lock, verifying every downloaded archive against its pinned SHA-256 before it
  is unpacked, then bundle core for the backends this repository builds.

  `nightly` is a mutable CDN alias, while the build lock binds the complete
  toolchain closure. Installing the pinned moonc-version snapshot means an
  unrelated nightly publication cannot break the gate.

  Deliberately does NOT cache the toolchain: the SHA-256 verification below is
  the repository's integrity story for the toolchain, and a restored cache
  entry would bypass the download it verifies.

inputs:
  toolchain-version:
    description: Full pinned toolchain version, e.g. "0.10.5+001eef869-nightly".
    required: true
  darwin-archive-sha256:
    description: SHA-256 of moonbit-darwin-aarch64.tar.gz. Required on macOS.
    required: false
    default: ""
  linux-archive-sha256:
    description: SHA-256 of moonbit-linux-x86_64.tar.gz. Required on Linux.
    required: false
    default: ""
  windows-archive-sha256:
    description: SHA-256 of moonbit-windows-x86_64.zip. Required on Windows.
    required: false
    default: ""
  unix-core-sha256:
    description: SHA-256 of the core tarball. Required on macOS and Linux.
    required: false
    default: ""
  windows-core-sha256:
    description: SHA-256 of the core zip. Required on Windows.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up MoonBit (pinned nightly, Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MOONBIT_TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
        MOONBIT_DARWIN_ARCHIVE_SHA256: ${{ inputs.darwin-archive-sha256 }}
        MOONBIT_LINUX_ARCHIVE_SHA256: ${{ inputs.linux-archive-sha256 }}
        MOONBIT_UNIX_CORE_SHA256: ${{ inputs.unix-core-sha256 }}
      run: |
        toolchain="$RUNNER_TEMP/moonbit-f1b-toolchain"
        archive="$RUNNER_TEMP/moonbit-f1b-toolchain.tar.gz"
        core_archive="$RUNNER_TEMP/moonbit-f1b-core.tar.gz"
        version_path="${MOONBIT_TOOLCHAIN_VERSION//+/%2B}"
        test ! -e "$toolchain" && test ! -L "$toolchain"
        case "$(uname -ms)" in
          'Darwin arm64')
            target=darwin-aarch64
            archive_sha="$MOONBIT_DARWIN_ARCHIVE_SHA256"
            ;;
          'Linux x86_64')
            target=linux-x86_64
            archive_sha="$MOONBIT_LINUX_ARCHIVE_SHA256"
            ;;
          *)
            echo "unsupported pinned MoonBit platform: $(uname -ms)" >&2
            exit 1
            ;;
        esac
        test -n "$archive_sha"
        test -n "$MOONBIT_UNIX_CORE_SHA256"
        curl -fsSL -o "$archive" \
          "https://cli.moonbitlang.com/binaries/$version_path/moonbit-$target.tar.gz"
        curl -fsSL -o "$core_archive" \
          "https://cli.moonbitlang.com/cores/core-$version_path.tar.gz"
        test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$archive_sha"
        test "$(shasum -a 256 "$core_archive" | awk '{print $1}')" = \
          "$MOONBIT_UNIX_CORE_SHA256"
        mkdir -m 0700 "$toolchain"
        tar -xzf "$archive" -C "$toolchain"
        mkdir -p "$toolchain/lib"
        tar -xzf "$core_archive" -C "$toolchain/lib"
        ln -sfn moon "$toolchain/bin/moonx"
        chmod +x "$toolchain"/bin/* "$toolchain/bin/internal/tcc"
        echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
        echo "$toolchain/bin" >> "$GITHUB_PATH"
        "$toolchain/bin/moon" -C "$toolchain/lib/core" bundle --warn-list -a --all
        "$toolchain/bin/moon" -C "$toolchain/lib/core" bundle --warn-list -a --target llvm
        "$toolchain/bin/moon" -C "$toolchain/lib/core" bundle --warn-list -a --target wasm-gc --quiet

    - name: Set up MoonBit (pinned nightly, Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.toolchain-version }}
        MOONBIT_WINDOWS_ARCHIVE_SHA256: ${{ inputs.windows-archive-sha256 }}
        MOONBIT_WINDOWS_CORE_SHA256: ${{ inputs.windows-core-sha256 }}
      run: |
        $toolchain = Join-Path $env:RUNNER_TEMP "moonbit-f1b-toolchain"
        $archive = Join-Path $env:RUNNER_TEMP "moonbit-f1b-toolchain.zip"
        $coreArchive = Join-Path $env:RUNNER_TEMP "moonbit-f1b-core.zip"
        if (Test-Path -LiteralPath $toolchain) {
          throw "MoonBit install root must be absent"
        }
        if (-not $env:MOONBIT_WINDOWS_ARCHIVE_SHA256 -or -not $env:MOONBIT_WINDOWS_CORE_SHA256) {
          throw "Windows MoonBit setup requires both pinned archive SHA-256 inputs"
        }
        $versionPath = $env:MOONBIT_INSTALL_VERSION.Replace("+", "%2B")
        $archiveUri = "https://cli.moonbitlang.com/binaries/$versionPath/moonbit-windows-x86_64.zip"
        $coreUri = "https://cli.moonbitlang.com/cores/core-$versionPath.zip"
        Invoke-WebRequest -Uri $archiveUri -OutFile $archive
        Invoke-WebRequest -Uri $coreUri -OutFile $coreArchive
        $actualArchiveSha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        $actualCoreSha = (Get-FileHash -Algorithm SHA256 $coreArchive).Hash.ToLowerInvariant()
        if ($actualArchiveSha -ne $env:MOONBIT_WINDOWS_ARCHIVE_SHA256) {
          throw "MoonBit toolchain archive SHA-256 mismatch"
        }
        if ($actualCoreSha -ne $env:MOONBIT_WINDOWS_CORE_SHA256) {
          throw "MoonBit core archive SHA-256 mismatch"
        }
        New-Item -Path $toolchain -ItemType Directory | Out-Null
        Expand-Archive $archive -DestinationPath $toolchain
        New-Item -Path "$toolchain\lib" -ItemType Directory -Force | Out-Null
        Expand-Archive $coreArchive -DestinationPath "$toolchain\lib"
        New-Item -ItemType HardLink -Path "$toolchain\bin\moonx.exe" -Value "$toolchain\bin\moon.exe" | Out-Null
        & "$toolchain\bin\moon.exe" -C "$toolchain\lib\core" bundle --warn-list -a --all
        & "$toolchain\bin\moon.exe" -C "$toolchain\lib\core" bundle --warn-list -a --target wasm-gc --quiet
        "MOON_HOME=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$toolchain\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: MoonBit versions
      shell: bash
      run: moon version --all

    # Populate the module registry so dependency resolution works on a fresh
    # runner (all deps are first-party: moonbitlang/async and moonbitlang/x).
    - name: Resolve dependencies
      shell: bash
      run: moon update
