name: office-registry-release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-registry-check:
    name: resolve and test ${{ matrix.module }} outside moon.work
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [office, office-cli]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit versions
        run: moon version --all

      # Stage source, required fixtures, and validators outside moon.work.
      # Hydrate dependencies, assert internal versions from the source manifest,
      # run full native/Wasm suites, and inspect the archive before a dry run.
      - name: Verify isolated registry consumer
        env:
          TMPDIR: ${{ runner.temp }}
          REGISTRY_TOKEN: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "Missing Mooncakes token" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.moon"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" > "$HOME/.moon/credentials.json"
          scripts/check_${{ matrix.module }}_registry_release.sh
