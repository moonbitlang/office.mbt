name: Publish Mooncakes packages

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish (office-cli publishes moonbitlang/office)
        type: choice
        default: all
        options:
          - all
          - mbtexcel
          - docx2html
          - pdflite
          - pdf2md
          - pagelayout
          - office-lib
          - office-cli
  release:
    types: [released]

permissions:
  contents: read

# Serialize releases, including manual retries, across refs.
concurrency:
  group: mooncakes-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: moon version
        run: |
          moon version --all
          moonrun --version
          moon update
      - name: Select modules
        shell: bash
        env:
          SELECTED_MODULE: ${{ inputs.module || 'all' }}
        run: |
          set -euo pipefail
          case "$SELECTED_MODULE" in
            all) modules="mbtexcel docx2html pdflite pdf2md pagelayout office-lib office-cli" ;;
            mbtexcel|docx2html|pdflite|pdf2md|pagelayout|office-lib|office-cli)
              modules="$SELECTED_MODULE" ;;
            *) echo "Unknown module: $SELECTED_MODULE" >&2; exit 1 ;;
          esac
          echo "PUBLISH_MODULES=$modules" >> "$GITHUB_ENV"

      - name: Validate selected modules
        shell: bash
        run: |
          set -euo pipefail
          read -r -a modules <<< "$PUBLISH_MODULES"
          packages=()
          for module in "${modules[@]}"; do
            # Explicit package paths include every child package in this module
            # without selecting tests from other workspace modules.
            while IFS= read -r manifest; do
              packages+=("${manifest%/moon.pkg}")
            done < <(git ls-files "$module/moon.pkg" "$module/**/moon.pkg")
          done
          test "${#packages[@]}" -gt 0
          moon check "${packages[@]}"
          moon info "${packages[@]}"
          git diff --exit-code -- "${modules[@]}"
          moon test "${packages[@]}"
          moon fmt "${packages[@]}"
          git diff --exit-code -- "${modules[@]}"

      # Dependencies must reach Mooncakes before their consumers.
      - name: Publish selected modules
        shell: bash
        run: |
          set -euo pipefail
          read -r -a modules <<< "$PUBLISH_MODULES"
          test -n "$SECRET" || { echo "Missing Mooncakes token" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.moon"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$SECRET" > "$HOME/.moon/credentials.json"
          for module in "${modules[@]}"; do
            echo "::group::Publish $module"
            (cd "$module" && moon publish)
            echo "::endgroup::"
          done
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
