name: docx2html-registry-release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-registry-check:
    name: resolve and test docx2html outside moon.work
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit versions
        run: moon version --all

      # This script copies docx2html/ and its SDK validation harness beyond the
      # repository's moon.work boundary. Hydrate registry dependencies before
      # frozen checks/tests, then inspect the archive before the publish dry run.
      # docx2html no longer depends on mbtexcel.
      - name: Verify isolated registry dependencies and publish payload
        env:
          TMPDIR: ${{ runner.temp }}
          REGISTRY_TOKEN: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "Missing Mooncakes token" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.moon"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" > "$HOME/.moon/credentials.json"
          scripts/check_docx2html_registry_release.sh
