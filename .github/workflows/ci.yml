name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job graph, cheapest first:
#
#   lint ──┬── test-native
#          ├── test-wasm
#          ├── test-js
#          ├── cli-smoke
#          ├── release-smoke
#          ├── transaction-platforms (macOS, Windows)
#          └── fresh-agent-contract (advisory, non-blocking)
#
# `lint` is ~2 minutes and gates the rest. It is where CI fails most: six of
# the ten most recent red runs died on `moon fmt` or `pkg.generated.mbti`
# drift, which used to surface roughly six minutes into a single monolithic
# job — after an advisory security canary had already spent five of them.
# Gating on `lint` means that class of failure now costs ~2 minutes of wall
# clock and no test-runner minutes at all.
#
# Everything downstream of `lint` is independent and runs concurrently. The
# three test backends alone were ~18 minutes of serial steps.
#
# `scripts/ci/local-gate.sh` runs exactly what `lint` runs, in ~13 seconds.
# Enable it as a pre-push hook with `git config core.hooksPath .githooks`.

# The toolchain is not pinned. CI runs the whole gate on both release channels
# and the run is green when *either* channel is fully green -- see the `gate`
# job at the end, which is the required check.
#
# A pin was the previous design and it failed on its own terms. MoonBit
# publishes fast enough that an immutable snapshot went two weeks stale and
# broke a PR for a core API present in every toolchain anyone would install,
# and bumping it meant re-deriving five archive digests plus a per-platform
# content digest of the installed toolchain that only a runner of that platform
# can produce. A pin that is routinely wrong is a maintenance tax, not a safety
# property.
#
# Two floating channels give coverage instead of verification. A channel that
# breaks for reasons this repository does not own reports without blocking --
# on 2026-08-15 nightly rejected `lexscan` over String, which was
# moonbitlang/x, not us. A genuine regression breaks both channels and still
# stops the merge.

jobs:

  # The fast gate. Everything else waits on this.

  lint:
    name: lint (fmt + interface + type check) [${{ matrix.channel }}]
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      # Format check across the whole workspace, including executable package
      # manifests now that every member uses the supported `pkgtype` syntax.
      - name: Format check
        run: |
          moon fmt
          if ! git diff --quiet; then
            echo "::error::moon fmt changed files; run moon fmt and commit the result (or scripts/ci/local-gate.sh)."
            git --no-pager diff
            exit 1
          fi

      # Regenerate every member's `pkg.generated.mbti` and fail if the committed
      # interfaces drift from the source (all four members commit their .mbti).
      # Run `moon info` and commit the result to fix.
      - name: Interface check
        run: |
          moon info
          if ! git diff --quiet -- '*pkg.generated.mbti'; then
            echo "::error::pkg.generated.mbti out of date; run moon info and commit (or scripts/ci/local-gate.sh)."
            git --no-pager diff --stat -- '*pkg.generated.mbti'
            exit 1
          fi

      # Type check all workspace members (native).
      - name: Type check
        run: moon check

      # Type check all workspace members for the wasm backend. mbtexcel's library + xlsx
      # CLI target wasm; docx2html's library packages also build for wasm (its
      # native-only CLI is skipped for this target).
      - name: Type check (wasm)
        run: moon check --target wasm

      # Keep the JavaScript runtime honest as well. Floating-point formatting
      # and target-specific package declarations have both regressed here
      # without affecting native or Wasm builds.
      - name: Type check (js)
        run: moon check --target js

  # The three test backends. Previously three serial steps in one job.
  #
  # This repo is a `moon work` workspace with four members: `.`
  # (bobzhang/mbtexcel), `./docx2html` (bobzhang/docx2html), and `./pdflite`
  # (bobzhang/pdflite), plus `./office` (the agent-facing facade). An
  # unfiltered `moon test` traverses every member and all of its packages, so
  # new portable child packages are covered automatically instead of silently
  # receiving root-only tests.
  #
  # mbtexcel's parity/fixture tests read a small committed subset of the
  # excelize test fixtures from `fixtures/excelize/` (see that directory's
  # README) — no upstream checkout is fetched at test time. (docx2html's own
  # fixtures are likewise committed under docx2html/tests/.)
  #
  # mbtexcel's `*_openxml_validity_test.mbt` tests and docx2html's
  # `sdk_validity_test.mbt` shell out to the Microsoft DocumentFormat.OpenXml
  # SDK validator via scripts/validate_xlsx.sh / validate_docx.sh, which use
  # the system `dotnet` when it has the net8 runtime. Every test job installs
  # .NET 8 so `moon test` runs real schema validation of generated workbooks
  # and docx packages, exactly as the single job used to.

  test-native:
    name: test (native) [${{ matrix.channel }}]
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      # Run all members' native test suites in one pass. Covers mbtexcel
      # (including OpenXML SDK schema validation via .NET), docx2html
      # (converter/reader/fixtures/stress), and pdflite (reader/writer/
      # fixture-acceptance, incl. native C-stub code paths).
      - name: Test (native)
        run: moon test --target native

  test-wasm:
    name: test (wasm) [${{ matrix.channel }}]
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      # An unfiltered invocation traverses every moon.work member and all of
      # its packages. Keep this module-wide so new portable child packages are
      # covered automatically instead of silently receiving root-only tests.
      - name: Test complete workspace (wasm)
        run: moon test --target wasm

  test-js:
    name: test (js) [${{ matrix.channel }}]
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      - name: Test complete workspace (js)
        run: moon test --target js

  # CLI-level coverage: cram docs, the wasm CLI smoke suite, and the
  # unified Office acceptance run.

  cli-smoke:
    name: CLI smoke (cram + wasm CLIs + Office acceptance) [${{ matrix.channel }}]
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      # Build only the CLIs the cram docs exercise — the rest of the workspace
      # is not needed by this job. (This split originally dodged a pathological
      # compile: the markdown CLI's CJK cmap tables expanded into an 87MB
      # generated C file that took gcc/clang the better part of an hour. That
      # is fixed — the tables are flat ReadOnlyArray data lowered to static C
      # arrays, and the pinned toolchain links debug executables straight to
      # object code. See docs/moonc-large-const-codegen.md.)
      - name: Build CLIs (native)
        run: moon build --target native cmd/xlsx docx2html/cmd/docx2html docx2html/cmd/docx office-cli pdflite/cmd/main pagelayout/cmd/pagelayout

      # Run the cram docs from a stub project so `moon cram test` does not
      # trigger a build of every workspace executable (keeps the job lean;
      # this is also how pdflite's own CI runs its cram). PATH supplies
      # xlsx.exe/docx2html.exe/docx.exe for the docs that invoke them by name;
      # pdflite's doc takes its CLI and fixture via env.
      - name: Cram tests (xlsx, docx2html, office, pdflite, pagelayout CLIs)
        env:
          PDFLITE_CLI: ${{ github.workspace }}/_build/native/debug/build/bobzhang/pdflite/cmd/main/main.exe
          PDFLITE_LOGO_PDF: ${{ github.workspace }}/pdflite/fixtures/camlpdf/logo.pdf
          PAGELAYOUT_CLI: ${{ github.workspace }}/_build/native/debug/build/bobzhang/pagelayout/cmd/pagelayout/pagelayout.exe
          PAGELAYOUT_DOCX: ${{ github.workspace }}/pagelayout/docx/fixture_render/single-paragraph.docx
        run: |
          STUB="$RUNNER_TEMP/moon-cram-stub"
          mkdir -p "$STUB"
          printf 'name = "bobzhang/cramstub"\nversion = "0.1.0"\n' > "$STUB/moon.mod"
          export PATH="$GITHUB_WORKSPACE/_build/native/debug/build/bobzhang/mbtexcel/cmd/xlsx:$GITHUB_WORKSPACE/_build/native/debug/build/bobzhang/docx2html/cmd/docx2html:$GITHUB_WORKSPACE/_build/native/debug/build/bobzhang/docx2html/cmd/docx:$GITHUB_WORKSPACE/_build/native/debug/build/bobzhang/office:$PATH"
          cd "$STUB"
          moon cram test "$GITHUB_WORKSPACE/cmd/xlsx/cram"
          moon cram test "$GITHUB_WORKSPACE/docx2html/tests/cram"
          moon cram test "$GITHUB_WORKSPACE/office/cmd/office/cram"
          moon cram test "$GITHUB_WORKSPACE/pdflite/tests/cram"
          moon cram test "$GITHUB_WORKSPACE/pagelayout/tests/cram"

      # The mbtexcel library and xlsx CLI also target wasm end to end. Build the
      # CLI for wasm and drive it (filesystem read/write via the async runtime).
      - name: Wasm build + CLI smoke test
        run: |
          moon build --target wasm cmd/xlsx
          moon run --target wasm cmd/xlsx -- create ci.xlsx --sheet Data
          moon run --target wasm cmd/xlsx -- set ci.xlsx Data A1 Hello
          got=$(moon run --target wasm cmd/xlsx -- get ci.xlsx Data A1 2>/dev/null)
          echo "get -> $got"; test "$got" = "Hello"
          moon run --target wasm cmd/xlsx -- view ci.xlsx
          # Agent JSON surface: exercise a styled cell and a chart, then
          # validate the payloads structurally (not by substring).
          moon run --target wasm cmd/xlsx -- set ci.xlsx Data B1 42
          moon run --target wasm cmd/xlsx -- style ci.xlsx Data A1 --bold --fill 4472C4
          moon run --target wasm cmd/xlsx -- chart ci.xlsx Data D2 --categories A1:A1 --values B1:B1 --name S
          o=$(moon run --target wasm cmd/xlsx -- outline ci.xlsx 2>/dev/null)
          echo "$o" | jq -e '.schema == "xlsx.outline/1"
            and (.sheets[0].kind == "worksheet")
            and (.sheets[0].charts | length == 1)
            and (.sheets[0].charts[0].kinds == ["barChart"])
            and (.sheets[0].used_range == "A1:B1")'
          j=$(moon run --target wasm cmd/xlsx -- get ci.xlsx Data A1:B2 --json 2>/dev/null)
          echo "$j" | jq -e '.schema == "xlsx.cells/1"
            and (.cells | length == 2)
            and ([.cells[].ref] == ["A1", "B1"])
            and (.styles[.cells[0].style_id | tostring].font.bold == true)
            and (.styles[.cells[0].style_id | tostring].fill.colors == ["4472C4"])'
          cat > ci-batch.json <<'JSON'
          {"schema": "xlsx.batch/1", "ops": [
            {"op": "set", "params": {"sheet": "Data", "cell": "A2", "value": 7.5}},
            {"op": "formula", "params": {"sheet": "Data", "cell": "A3", "formula": "=A2*2"}},
            {"op": "merge", "params": {"sheet": "Data", "cell_range": "C1:D1"}}
          ]}
          JSON
          # The bad param name must fail with the op-indexed error, and the
          # file must be byte-identical afterwards (no write on failure).
          cp ci.xlsx ci-before.xlsx
          out=$(moon run --target wasm cmd/xlsx -- batch ci.xlsx ci-batch.json 2>&1) && { echo "expected the bad script to fail"; exit 1; } || true
          echo "$out" | grep -q "error: op 2 (merge): missing param 'range'"
          cmp ci.xlsx ci-before.xlsx
          sed -i.bak 's/"cell_range"/"range"/' ci-batch.json
          rm ci-batch.json.bak
          b=$(moon run --target wasm cmd/xlsx -- batch ci.xlsx ci-batch.json 2>/dev/null)
          echo "batch -> $b"; test "$b" = "applied 3 op(s) to ci.xlsx"
          c=$(moon run --target wasm cmd/xlsx -- calc ci.xlsx Data A3 2>/dev/null)
          echo "calc A3 -> $c"; test "$c" = "15"
          v=$(moon run --target wasm cmd/xlsx -- validate ci.xlsx 2>/dev/null)
          echo "validate -> $v"; test "$v" = "valid"
          # The canonical office CLI dispatches by verified package content,
          # not extension alone. Exercise both supported formats under wasm.
          moon build --target wasm office-cli
          f=$(moon run --target wasm office-cli -- identify ci.xlsx 2>office-wasm.err) || { echo "office xlsx identify failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "office identify xlsx -> $f"; test "$f" = "xlsx"
          f=$(moon run --target wasm office-cli -- identify docx2html/tests/cram/fixtures/single-paragraph.docx 2>office-wasm.err) || { echo "office docx identify failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "office identify docx -> $f"; test "$f" = "docx"
          o=$(moon run --target wasm office-cli -- identify ci.xlsx --json 2>office-wasm.err) || { echo "office JSON identify failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$o" | jq -e '.schema == "office.output/1"
            and .success == true
            and .data.schema == "office.identify/1"
            and .data.format == "xlsx"'
          h=$(moon run --target wasm office-cli -- help all --json 2>office-wasm.err) || { echo "office JSON help failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$h" | jq -e '.schema == "office.output/1"
            and .success == true
            and .data.schema == "office.capabilities/2"
            and (.data.fingerprint | test("^crc32:[0-9a-f]{8}$"))
            and ([.data.records[].name] == ["docx", "xlsx", "help", "identify", "outline", "get", "text", "query", "validate", "dump", "replay", "issues", "preview", "render", "create", "template", "edit", "annotate", "batch", "raw"])'
          moon run --target wasm office-cli -- help all --jsonl 2>office-wasm.err \
            | jq -se 'length == 20 and all(.[]; .schema == "office.capability/2")'
          moon run --target wasm office-cli -- help schemas 2>office-wasm.err \
            | grep -q '^Consumed input contracts$'
          hs=$(moon run --target wasm office-cli -- help schemas --json 2>office-wasm.err)
          echo "$hs" | jq -e '.success == true and .data.schema == "office.input-contracts/1" and (.data.contracts | length) == 5'
          moon run --target wasm office-cli -- help schemas --jsonl 2>office-wasm.err \
            | jq -e '.schema == "office.input-contracts/1" and (.contracts | length) == 5'
          moon run --target wasm office-cli -- help schema docx.batch/2 2>office-wasm.err \
            | jq -e '.schema == "office.input-contract/1" and .id == "docx.batch/2"'
          hc=$(moon run --target wasm office-cli -- help schema docx.batch/2 --json 2>office-wasm.err)
          echo "$hc" | jq -e '.success == true and .data.schema == "office.input-contract/1" and .data.id == "docx.batch/2"'
          moon run --target wasm office-cli -- help schema docx.batch/2 --jsonl 2>office-wasm.err \
            | jq -e '.schema == "office.input-contract/1" and .id == "docx.batch/2"'
          v=$(moon run --target wasm office-cli -- validate ci.xlsx --json 2>office-wasm.err) || { echo "office wasm validate failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$v" | jq -e '.schema == "office.output/1"
            and .success == true
            and .data.schema == "office.validate/1"
            and .data.valid == true
            and .data.error_count == 0'
          if moon run --target wasm office-cli -- help xlxs --json >office-wasm-error.json 2>office-wasm.err; then
            echo "expected unknown office help format to fail"
            exit 1
          fi
          jq -e '.schema == "office.output/1"
            and .success == false
            and .error.code == "office.unknown_format"
            and .error.details.suggestions == ["xlsx"]' office-wasm-error.json
          # XLSX structured reads share the validated bounded archive and use
          # canonical name-keyed paths even when the input selector is positional.
          # The third-party Book1 fixture has intersecting shared-formula ranges;
          # normalize that unrelated invalid metadata through the raw transaction
          # surface before exercising the fixture's original contents.
          xlsx_source=fixtures/excelize/test/Book1.xlsx
          xlsx_sheet="$RUNNER_TEMP/office-book1-sheet2.xml"
          xlsx_sheet_valid="$RUNNER_TEMP/office-book1-sheet2-valid.xml"
          xlsx_fixture="$RUNNER_TEMP/office-Book1-valid.xlsx"
          moon run --target wasm office-cli -- raw read "$xlsx_source" /Sheet2 --output "$xlsx_sheet" >/dev/null
          sed -e 's/ref="F11:H11"/ref="F11:F11"/' -e 's/<f t="shared" si="0"><\/f>/<f t="shared" si="1"><\/f>/' "$xlsx_sheet" >"$xlsx_sheet_valid"
          moon run --target wasm office-cli -- raw replace "$xlsx_source" /Sheet2 --xml-file "$xlsx_sheet_valid" --out "$xlsx_fixture" --json >/dev/null
          xo=$(moon run --target wasm office-cli -- outline "$xlsx_fixture" --json 2>office-wasm.err) || { echo "office XLSX outline failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xo" | jq -e '.success == true
            and .data.schema == "office.xlsx.outline/1"
            and .data.path == "/xlsx/workbook"
            and [.data.sheets[].path] == ["/xlsx/sheet[name=\"Sheet1\"]", "/xlsx/sheet[name=\"Sheet2\"]"]'
          singleton_fixture=fixtures/excelize/test/OverflowNumericCell.xlsx
          xs=$(moon run --target wasm office-cli -- outline "$singleton_fixture" --json 2>office-wasm.err) || { echo "office XLSX singleton outline failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xs" | jq -e '.success == true
            and .data.sheets[0].used_range.reference == "A1:A1"
            and .data.sheets[0].used_range.path == "/xlsx/sheet[name=\"Sheet1\"]/range[A1:A1]"'
          xsg=$(moon run --target wasm office-cli -- get "$singleton_fixture" '/xlsx/sheet[1]/range[A1:A1]' --json 2>office-wasm.err) || { echo "office XLSX singleton get failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xsg" | jq -e '.success == true
            and .data.reference == "A1:A1"
            and [.data.cells[].reference] == ["A1"]'
          xg=$(moon run --target wasm office-cli -- get "$xlsx_fixture" '/xlsx/sheet[1]/range[A19:B19]' --json 2>office-wasm.err) || { echo "office XLSX get failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xg" | jq -e '.success == true
            and .data.schema == "office.xlsx.element/1"
            and .data.path == "/xlsx/sheet[name=\"Sheet1\"]/range[A19:B19]"
            and [.data.cells[].reference] == ["A19", "B19"]
            and .data.cells[1].formula == "SUM(Sheet2!D2,Sheet2!D11)"'
          xt=$(moon run --target wasm office-cli -- text "$xlsx_fixture" --under '/xlsx/sheet[name="Sheet1"]' --offset 1 --limit 2 --json 2>office-wasm.err) || { echo "office XLSX text failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xt" | jq -e '.success == true
            and .data.schema == "office.xlsx.text/1"
            and .data.matched_total == 5
            and [.data.entries[].text] == ["237", "Column1"]'
          xq=$(moon run --target wasm office-cli -- query "$xlsx_fixture" 'cell[type=formula][formula~=IF]' --under '/xlsx/sheet[name="Sheet2"]' --json 2>office-wasm.err) || { echo "office XLSX query failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xq" | jq -e '.success == true
            and .data.schema == "office.xlsx.query/1"
            and .data.matched_total == 4
            and [.data.matches[].reference] == ["F11", "G11", "H11", "I11"]'
          # Fresh creation and strict batch mutation use the same async,
          # bounded transaction path on wasm as native.
          xc=$(moon run --target wasm office-cli -- create xlsx ci-office-created.xlsx --sheet Data --json 2>office-wasm.err) || { echo "office XLSX create failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xc" | jq -e '.success == true
            and .data.schema == "office.xlsx.create/1"
            and .data.sheet == "Data"
            and .data.transaction.committed == true'
          cat >ci-office-batch.json <<'JSON'
          {"schema":"xlsx.batch/1","ops":[{"op":"set","params":{"sheet":"Data","cell":"A1","value":"wasm"}},{"op":"formula","params":{"sheet":"Data","cell":"B1","formula":"=LEN(A1)"}}]}
          JSON
          xb=$(moon run --target wasm office-cli -- batch ci-office-created.xlsx ci-office-batch.json --out ci-office-batched.xlsx --json 2>office-wasm.err) || { echo "office XLSX batch failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xb" | jq -e '.success == true
            and .data.schema == "office.xlsx.batch/1"
            and .data.stats.operation_count == 2
            and .data.stats.touched_cells == 2
            and .data.transaction.committed == true
            and any(.warnings[]; .code == "office.xlsx.full_rewrite")'
          xbg=$(moon run --target wasm office-cli -- get ci-office-batched.xlsx '/xlsx/sheet[name="Data"]/range[A1:B1]' --json 2>office-wasm.err) || { echo "office XLSX batch readback failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$xbg" | jq -e '.success == true
            and .data.cells[0].raw.value == "wasm"
            and .data.cells[1].formula == "LEN(A1)"'
          # Fresh DOCX creation and authoring (D3) run through the same wasm
          # async transaction path.
          dc=$(moon run --target wasm office-cli -- create docx ci-office-created.docx --json 2>office-wasm.err) || { echo "office DOCX create failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$dc" | jq -e '.success == true
            and .data.schema == "office.docx.create/1"
            and .data.format == "docx"
            and .data.transaction.committed == true'
          printf '{"schema": "docx.batch/2", "ops": [{"op": "paragraph", "params": {"text": "Heading", "style": "Heading1"}}, {"op": "paragraph", "params": {"runs": [{"text": "body", "bold": true}]}}, {"op": "comment", "params": {"on": 0, "text": "note", "author": "CI"}}]}' > ci-office-author.json
          db=$(moon run --target wasm office-cli -- batch --format docx ci-office-authored.docx ci-office-author.json --json 2>office-wasm.err) || { echo "office DOCX authoring failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$db" | jq -e '.success == true
            and .data.schema == "office.docx.batch/1"
            and .data.ops == 3
            and .data.comments == 1
            and .data.transaction.committed == true'
          dbt=$(moon run --target wasm office-cli -- text ci-office-authored.docx --json 2>office-wasm.err) || { echo "office DOCX authoring readback failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$dbt" | jq -e '.success == true
            and (.data.entries[0].text == "Heading")
            and (.data.entries[1].text == "body")'
          # DOCX structured reads share one canonical bounded projection.
          # Drive every command through the wasm async filesystem path.
          o=$(moon run --target wasm office-cli -- outline docx2html/tests/cram/fixtures/single-paragraph.docx --json 2>office-wasm.err) || { echo "office DOCX outline failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$o" | jq -e '.success == true
            and .data.schema == "office.docx.outline/1"
            and .data.counts.paragraphs == 1
            and [.data.stories[].path] == ["/docx/body", "/docx/footnotes", "/docx/endnotes", "/docx/comments"]'
          g=$(moon run --target wasm office-cli -- get docx2html/tests/cram/fixtures/commented.docx '/docx/comments/comment[id="0"]' --json 2>office-wasm.err) || { echo "office DOCX get failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$g" | jq -e '.success == true
            and .data.schema == "office.docx.element/1"
            and .data.stability == "stable"
            and .data.metadata.author == "Ada Lovelace"'
          t=$(moon run --target wasm office-cli -- text docx2html/tests/cram/fixtures/header-footer.docx --json 2>office-wasm.err) || { echo "office DOCX text failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$t" | jq -e '.success == true
            and .data.schema == "office.docx.text/1"
            and [.data.entries[].path] == ["/docx/body/p[1]", "/docx/body/p[2]", "/docx/header[1]/p[1]", "/docx/header[2]/p[1]", "/docx/footer[1]/p[1]"]'
          q=$(moon run --target wasm office-cli -- query docx2html/tests/cram/fixtures/tiny-picture.docx --kind picture --json 2>office-wasm.err) || { echo "office DOCX query failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$q" | jq -e '.success == true
            and .data.schema == "office.docx.query/1"
            and .data.matched_total == 1
            and .data.matches[0].path == "/docx/body/p[1]/r[1]/image[1]"'
          # Raw OOXML uses the same async filesystem and A4 transaction on
          # wasm. Exercise relationship-derived aliases, dry-run preservation,
          # atomic separate-output publication, and both Office formats.
          r=$(moon run --target wasm office-cli -- raw list ci.xlsx --json 2>office-wasm.err) || { echo "office raw list failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$r" | jq -e '.schema == "office.output/1"
            and .success == true
            and .data.schema == "office.raw.inventory/1"
            and any(.data.parts[]; .aliases | index("/Data"))'
          r=$(moon run --target wasm office-cli -- raw read docx2html/tests/cram/fixtures/single-paragraph.docx /document --json 2>office-wasm.err) || { echo "office raw DOCX read failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$r" | jq -e '.success == true
            and .data.schema == "office.raw.part/1"
            and (.data.content | contains("Walking on imported air"))'
          cp ci.xlsx ci-raw-before.xlsx
          r=$(moon run --target wasm office-cli -- raw edit ci.xlsx /Data --path '/x:worksheet/x:sheetData/x:row[1]' --action set-attribute --attribute ht --value 15 --dry-run --json 2>office-wasm.err) || { echo "office raw dry-run failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$r" | jq -e '.success == true
            and .data.change.action == "set-attribute"
            and .data.transaction.dry_run == true
            and .data.transaction.committed == false
            and .data.transaction.preservation.changed == ["xl/worksheets/sheet1.xml"]'
          cmp ci.xlsx ci-raw-before.xlsx
          r=$(moon run --target wasm office-cli -- raw edit ci.xlsx /Data --path '/x:worksheet/x:sheetData/x:row[1]' --action set-attribute --attribute ht --value 15 --out ci-raw.xlsx --json 2>office-wasm.err) || { echo "office raw commit failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$r" | jq -e '.success == true
            and .data.transaction.committed == true
            and .data.transaction.preservation.changed == ["xl/worksheets/sheet1.xml"]'
          r=$(moon run --target wasm office-cli -- raw read ci-raw.xlsx /Data --json 2>office-wasm.err) || { echo "office raw readback failed; stderr:"; cat office-wasm.err; exit 1; }
          echo "$r" | jq -e '.success == true and (.data.content | contains("ht=\"15\""))'
          # The docx agent CLI also targets wasm end to end: build it and
          # drive its convert subcommand over a committed fixture. Keep the
          # captured stderr and print it on failure — discarding it makes a
          # red run undebuggable.
          moon build --target wasm docx2html/cmd/docx
          d=$(moon run --target wasm docx2html/cmd/docx -- convert docx2html/tests/cram/fixtures/single-paragraph.docx 2>docx-wasm.err) || { echo "docx convert failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "docx convert -> $d"
          test "$d" = "<p>Walking on imported air</p>" || { echo "unexpected output; stderr:"; cat docx-wasm.err; exit 1; }
          # Agent JSON surface: validate the outline payload structurally.
          o=$(moon run --target wasm docx2html/cmd/docx -- outline docx2html/tests/cram/fixtures/tiny-picture.docx 2>docx-wasm.err) || { echo "docx outline failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "$o" | jq -e '.schema == "docx.outline/1"
            and (.counts.paragraphs == 1)
            and (.counts.images == 1)
            and (.images[0].content_type == "image/png")'
          g=$(moon run --target wasm docx2html/cmd/docx -- get docx2html/tests/cram/fixtures/tiny-picture.docx '/body/p[1]/r[1]/image[1]' --json 2>docx-wasm.err) || { echo "docx get failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "$g" | jq -e '.schema == "docx.element/1"
            and (.kind == "image")
            and (.path == "/body/p[1]/r[1]/image[1]")'
          v=$(moon run --target wasm docx2html/cmd/docx -- validate docx2html/tests/cram/fixtures/single-paragraph.docx 2>docx-wasm.err) || { echo "docx validate failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "docx validate -> $v"; test "$v" = "valid"
          # Write foundation: create a blank document on wasm and gate it
          # with the portable validator.
          moon run --target wasm docx2html/cmd/docx -- create ci-blank.docx 2>docx-wasm.err || { echo "docx create failed; stderr:"; cat docx-wasm.err; exit 1; }
          c=$(moon run --target wasm docx2html/cmd/docx -- validate ci-blank.docx 2>docx-wasm.err) || { echo "blank validate failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "blank validate -> $c"; test "$c" = "valid"
          # Authoring surface: batch a document from an op script on wasm —
          # docx.batch/2 with a comment (Phase-2 K1), read back through the
          # annotation surface of the same build.
          printf '{"schema": "docx.batch/2", "ops": [{"op": "paragraph", "params": {"runs": [{"text": "Hi"}, {"footnote": {"text": "a wasm footnote"}}], "style": "Heading1"}}, {"op": "comment", "params": {"on": 0, "text": "wasm note", "author": "CI"}}, {"op": "comment", "params": {"reply_to": 1, "done": true, "text": "resolved", "author": "CI2"}}]}' > ci-batch.json
          moon run --target wasm docx2html/cmd/docx -- batch ci-batch.docx ci-batch.json 2>docx-wasm.err || { echo "docx batch failed; stderr:"; cat docx-wasm.err; exit 1; }
          b=$(moon run --target wasm docx2html/cmd/docx -- validate ci-batch.docx 2>docx-wasm.err) || { echo "batch validate failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "batch validate -> $b"; test "$b" = "valid"
          w=$(moon run --target wasm docx2html/cmd/docx -- outline ci-batch.docx 2>docx-wasm.err | jq -r '.comments[0].author + " " + .comments[1].parent_id + " " + (.comments[1].done | tostring) + " " + (.counts.footnotes | tostring)') || { echo "batch outline failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "written thread -> $w"; test "$w" = "CI 0 true 1"
          # Annotate an EXISTING document on wasm (Phase-2 L1): byte-span
          # surgery through the same build, read back via its outline.
          moon run --target wasm docx2html/cmd/docx -- annotate add ci-batch.docx ci-annotated.docx --at /body/p[1] --text "wasm annotate" --author L1 2>docx-wasm.err || { echo "annotate failed; stderr:"; cat docx-wasm.err; exit 1; }
          n=$(moon run --target wasm docx2html/cmd/docx -- outline ci-annotated.docx 2>docx-wasm.err | jq -r '.comments | length') || { echo "annotated outline failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "annotated comments -> $n"; test "$n" = "3"
          # The L2 verbs on wasm: reply to the fresh comment, resolve it.
          moon run --target wasm docx2html/cmd/docx -- annotate reply ci-annotated.docx ci-replied.docx --comment 2 --text "wasm reply" --author L2 2>docx-wasm.err || { echo "reply failed; stderr:"; cat docx-wasm.err; exit 1; }
          moon run --target wasm docx2html/cmd/docx -- annotate resolve ci-replied.docx ci-resolved.docx --comment 2 2>docx-wasm.err || { echo "resolve failed; stderr:"; cat docx-wasm.err; exit 1; }
          t=$(moon run --target wasm docx2html/cmd/docx -- outline ci-resolved.docx 2>docx-wasm.err | jq -r '[.comments[] | select(.id == "2" or .parent_id == "2")] | map(.done) | tostring') || { echo "resolved outline failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "thread done flags -> $t"; test "$t" = "[true,false]"
          # Annotation read surface on wasm (Phase-2 J2).
          a=$(moon run --target wasm docx2html/cmd/docx -- outline docx2html/tests/cram/fixtures/commented.docx 2>docx-wasm.err | jq -r '.comments[1].parent_id') || { echo "annotated outline failed; stderr:"; cat docx-wasm.err; exit 1; }
          echo "comment parent_id -> $a"; test "$a" = "0"
          # The checked-in authoring acceptance scenario (see
          # docx2html/tests/acceptance/README.md) — same wasm build.
          bash docx2html/tests/acceptance/run.sh

      - name: Unified Office acceptance (native + wasm)
        run: |
          bash office/tests/acceptance/run.sh native
          bash office/tests/acceptance/run.sh wasm

  # The installed Office release: build a prepared candidate from a clean
  # tree, assert its manifest shape, and run acceptance against the installed
  # binaries. The Codex permission-profile canary rides along as an explicitly
  # advisory second step.

  release-smoke:
    name: installed Office release smoke (Ubuntu) [${{ matrix.channel }}]
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      - name: Install pinned Codex CLI and runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof netcat-openbsd
          npm install --global @openai/codex@0.145.0

      - name: Capture installed MoonBit inventory
        run: |
          manifest="$RUNNER_TEMP/moonbit-f1b-toolchain.manifest"
          test ! -e "$manifest" && test ! -L "$manifest"
          office/tests/acceptance/fresh-agent/inventory.sh \
            "$MOON_HOME" "$manifest" linux-x86_64 \
            CREDITS.md bin include lib share
          shasum -a 256 "$manifest"
          echo "F1B_TOOLCHAIN_MANIFEST=$manifest" >> "$GITHUB_ENV"

      # Required. The prepared candidate must build from a clean tree, its
      # manifest must have exactly the expected shape, and native + Wasm
      # acceptance must pass against the installed binaries.
      - name: Prepared-candidate build + Office acceptance
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          head="$EXPECTED_HEAD"
          install_parent=$(mktemp -d /var/tmp/office-f1b-install.XXXXXX)
          prefix="$install_parent/candidate"
          prepare="$PWD/office/tests/acceptance/fresh-agent/prepare.sh"
          moon_bin=$(command -v moon)
          moonc_bin=$(command -v moonc)
          moonrun_bin=$(command -v moonrun)
          test "$(git rev-parse --verify HEAD)" = "$head"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          (
            cd /var/tmp
            PERL5OPT=-MOfficeF1BMustNotLoad \
            TAR_OPTIONS=--office-f1b-must-not-be-read \
            "$prepare" \
              "$head" "$prefix" \
              "$moon_bin" "$moonc_bin" "$moonrun_bin"
          )
          bash office/tests/acceptance/run.sh native \
            "$prefix/bin/office-native"
          bash office/tests/acceptance/run.sh wasm \
            "$prefix/bin/office-wasm"
          jq -e \
            --arg head "$head" \
            '.schema == "office.fresh-agent.candidate/5"
              and .candidate_head == $head
              and (.files | map(.path)) == [
                "bin/office-native",
                "bin/office-wasm",
                "libexec/moonrun",
                "libexec/office.wasm",
                "control/run.sh",
                "control/prompt.md",
                "control/final.schema.json",
                "control/permission-canary.sh",
                "control/attest.py",
                "control/argument-policy.py",
                "control/auth-guard.py",
                "control/command-policy.py",
                "control/opc-policy.py",
                "control/transcript-policy.py",
                "control/scenario-policy.py",
                "control/evidence-policy.py",
                "control/private.json",
                "control/inventory.sh",
                "control/build-lock.json",
                "control/toolchain.manifest",
                "control/dependencies.manifest",
                "control/build-host.json",
                "control/build-host.manifest",
                "control/build-host-discovery.py",
                "control/build-host-discovery.json"
              ]
              and .symlinks == [
                {path: "bin/office", target: "office-native"}
              ]' \
            "$prefix/CANDIDATE.json"
          echo "F1B_CANDIDATE_PREFIX=$prefix" >> "$GITHUB_ENV"

      # Advisory. This never could fail the job: the canary invocation was
      # already wrapped in an `if`/`else` that downgraded failure to a
      # `::warning`. Splitting it out makes that explicit and stops a canary
      # regression from sharing one red X with the real gates above.
      #
      # Provenance/security hardening stays bounded and advisory until #270
      # makes the cross-platform Codex probes portable and predictably timed.
      - name: Codex permission-profile canary (advisory)
        continue-on-error: true
        timeout-minutes: 20
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          head="$EXPECTED_HEAD"
          prefix="$F1B_CANDIDATE_PREFIX"
          candidate_sha=$(/usr/bin/shasum -a 256 "$prefix/CANDIDATE.json" | /usr/bin/awk '{print substr($1, length($1) - 63)}')
          codex_native=$(find "$(npm root -g)/@openai" -type f \
            -path '*/vendor/*/bin/codex' -print | head -n 1)
          test -n "$codex_native"
          test -z "$(command -v bwrap || true)"
          codex_vendor=$(/usr/bin/dirname "$(/usr/bin/dirname "$codex_native")")
          codex_bwrap="$codex_vendor/codex-resources/bwrap"
          test -f "$codex_bwrap"
          test -x "$codex_bwrap"
          codex_sha=a2a05dafaa1acb002a45eaec0a462de5b13694fcfcd7bc43305f14781ce7be14
          actual_codex_sha=$(/usr/bin/shasum -a 256 "$codex_native" | /usr/bin/awk '{print substr($1, length($1) - 63)}')
          test "$actual_codex_sha" = "$codex_sha"
          bwrap_sha=77360cb751ccedc5971391444ac86a8a33c15b04d6b4a6fe45f5d25496e62c4c
          actual_bwrap_sha=$(/usr/bin/shasum -a 256 "$codex_bwrap" | /usr/bin/awk '{print substr($1, length($1) - 63)}')
          test "$actual_bwrap_sha" = "$bwrap_sha"
          run_parent=$(mktemp -d /var/tmp/office-f1b-canary.XXXXXX)
          echo "F1B_CANARY_EVIDENCE=$run_parent/evidence" >> "$GITHUB_ENV"

          # Match the official codex-action prerequisite for GitHub-hosted
          # Linux. Restore both host settings even when the canary fails.
          original_userns_clone=$(
            sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true
          )
          original_apparmor_userns=$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns \
              2>/dev/null || true
          )
          restore_userns_policy() {
            status=$?
            trap - EXIT
            if test -n "$original_apparmor_userns"; then
              sudo sysctl -q -w \
                kernel.apparmor_restrict_unprivileged_userns="$original_apparmor_userns" || \
                status=1
            fi
            if test -n "$original_userns_clone"; then
              sudo sysctl -q -w \
                kernel.unprivileged_userns_clone="$original_userns_clone" || \
                status=1
            fi
            exit "$status"
          }
          trap restore_userns_policy EXIT
          if test -n "$original_userns_clone" && \
            test "$original_userns_clone" != 1; then
            sudo sysctl -q -w kernel.unprivileged_userns_clone=1
          fi
          if test -n "$original_apparmor_userns" && \
            test "$original_apparmor_userns" != 0; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          if "$prefix/control/run.sh" --canary-only \
            "$head" "$candidate_sha" \
            "$run_parent/probe" "$run_parent/evidence" \
            "$codex_native" "$codex_sha" \
            "$codex_bwrap" "$bwrap_sha" && \
            jq -e --arg bwrap_sha "$bwrap_sha" \
              '.codex.bubblewrap == {
                selection: "private",
                sha256: $bwrap_sha,
                privately_staged: true
              }
                and .verdict == "CANARY PASS"' \
              "$run_parent/evidence/RUN.json" && \
            jq -e --arg bwrap_sha "$bwrap_sha" \
              '.codex.bubblewrap == {
                selection: "private",
                sha256: $bwrap_sha,
                privately_staged: true
              }' \
              "$run_parent/evidence/RUN-PREFLIGHT.json"; then
            echo "Codex permission-profile canary passed"
          else
            echo "::warning title=Codex permission-profile canary::The optional security canary failed after native and Wasm Office acceptance passed"
          fi

      - name: Upload installed MoonBit inventory
        if: ${{ always() && env.F1B_TOOLCHAIN_MANIFEST != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-agent-toolchain-ubuntu-${{ matrix.channel }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.F1B_TOOLCHAIN_MANIFEST }}
          if-no-files-found: error

      - name: Upload real Codex canary evidence (Ubuntu)
        if: ${{ always() && env.F1B_CANARY_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-agent-canary-ubuntu-${{ matrix.channel }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.F1B_CANARY_EVIDENCE }}
          if-no-files-found: warn

  # Cross-platform transactional editing. macOS additionally builds and
  # accepts a prepared candidate. The 10-minute advisory fresh-agent runner
  # contract that used to sit in front of that work has moved to its own
  # non-blocking job below.

  transaction-platforms:
    name: office transactional editing (${{ matrix.os }}) [${{ matrix.channel }}]
    needs: lint
    runs-on: ${{ matrix.os }}
    # one leg failing is not a verdict; the `gate` job decides
    continue-on-error: true
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        channel: [latest, nightly]
    steps:
      # The repository contains deliberate path-length boundary fixtures whose
      # names exceed the legacy Win32 MAX_PATH limit. Enable Git long paths
      # before checkout so the Windows transaction gate can reach MoonBit.
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      - name: Install pinned Codex CLI (macOS canary)
        if: runner.os == 'macOS'
        run: npm install --global @openai/codex@0.145.0

      - name: Prepared-candidate Office smoke + optional Codex canary (macOS)
        if: runner.os == 'macOS'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          head="$EXPECTED_HEAD"
          parent=$(mktemp -d "${TMPDIR}/office-f1b-ci.XXXXXX")
          prefix="$parent/candidate"
          moon_bin=$(command -v moon)
          moonc_bin=$(command -v moonc)
          moonrun_bin=$(command -v moonrun)
          test "$(git rev-parse --verify HEAD)" = "$head"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          PERL5OPT=-MOfficeF1BMustNotLoad \
          TAR_OPTIONS=--office-f1b-must-not-be-read \
          office/tests/acceptance/fresh-agent/prepare.sh \
            "$head" "$prefix" \
            "$moon_bin" "$moonc_bin" "$moonrun_bin"
          bash office/tests/acceptance/run.sh native \
            "$prefix/bin/office-native"
          bash office/tests/acceptance/run.sh wasm \
            "$prefix/bin/office-wasm"
          candidate_sha=$(/usr/bin/shasum -a 256 "$prefix/CANDIDATE.json" | /usr/bin/awk '{print substr($1, length($1) - 63)}')
          codex_native=$(find "$(npm root -g)/@openai" -type f \
            -path '*/vendor/*/bin/codex' -print | head -n 1)
          test -n "$codex_native"
          codex_sha=1da3f4e0e96028b8a771814293c3033dafd1971f943f6c7e79b0897fe705f590
          actual_codex_sha=$(/usr/bin/shasum -a 256 "$codex_native" | /usr/bin/awk '{print substr($1, length($1) - 63)}')
          test "$actual_codex_sha" = "$codex_sha"
          echo "F1B_CANARY_EVIDENCE=$parent/evidence" >> "$GITHUB_ENV"
          if "$prefix/control/run.sh" --canary-only \
            "$head" "$candidate_sha" \
            "$parent/probe" "$parent/evidence" \
            "$codex_native" "$codex_sha"; then
            echo "Codex permission-profile canary passed"
          else
            echo "::warning title=Codex permission-profile canary::The optional security canary failed after native and Wasm Office acceptance passed"
          fi

      - name: Upload real Codex canary evidence (macOS)
        if: ${{ always() && runner.os == 'macOS' && env.F1B_CANARY_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-agent-canary-macos-${{ matrix.channel }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.F1B_CANARY_EVIDENCE }}
          if-no-files-found: warn

      - name: Check transactional editing packages
        run: |
          moon check --target native office/transaction
          moon check --target native office/transaction/permission_contract
          moon check --target native office/docx

      - name: Test transactional editing packages
        # Keep async-fs temporary fixtures on the checkout volume. The Windows
        # suite deliberately exercises current-drive-root paths (for example,
        # `\\a\\b.docx`), which are meaningful only when the fixture and the
        # process working directory share a drive.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          moon test --target native office/transaction
          moon test --target native office/transaction/permission_contract
          moon test --target native office/docx

  # Advisory only. This harness-only contract took 10m13s on macOS and sat in
  # front of that job's real gate; #270 tracks restoring it as a required
  # check once the cross-platform Codex probes are portable and predictably
  # timed. Until then it runs here, where it costs nothing on the critical
  # path.

  fresh-agent-contract:
    name: fresh-agent runner contract (${{ matrix.os }}) [${{ matrix.channel }}, advisory]
    needs: lint
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        channel: [latest, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"

      - uses: ./.github/actions/setup-moonbit
        with:
          channel: ${{ matrix.channel }}

      - name: Install runner dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof netcat-openbsd

      - name: Fresh-agent runner contract
        continue-on-error: true
        timeout-minutes: 10
        run: office/tests/acceptance/fresh-agent/run_test.sh

  # The required check.
  #
  # Every gate job runs on both channels with `continue-on-error`, so no single
  # leg is a verdict. This is: did *some* channel pass everything. That is a
  # stronger question than "did each job pass somewhere", which can go green
  # while no channel builds and tests the whole repository.
  #
  # Precisely: "channel" here means whatever that mutable alias served each
  # job, not one pinned build. Every leg resolves the alias independently, so a
  # publication mid-run can hand two legs of the same channel different
  # versions. Each job logs `moon version --all`, which is how you find out
  # after the fact. Making this literally one toolchain would mean resolving
  # once and distributing the resolved version, which is worth doing only if
  # that race ever actually bites.
  #
  # Job results are read back from the run itself rather than passed through
  # artifacts, because a matrix leg cannot set a distinct job output.
  gate:
    name: gate
    needs:
      - lint
      - test-native
      - test-wasm
      - test-js
      - cli-smoke
      - release-smoke
      - transaction-platforms
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Require one fully green channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The exact non-advisory legs each channel must contribute. Counting
          # what the API happens to return is not enough: a renamed job, or a
          # short page, would leave a channel looking complete at 1/1. Missing
          # has to fail the same way failed does.
          expected="lint (fmt + interface + type check)
          test (native)
          test (wasm)
          test (js)
          CLI smoke (cram + wasm CLIs + Office acceptance)
          installed Office release smoke (Ubuntu)
          office transactional editing (macos-latest)
          office transactional editing (windows-latest)"
          jobs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | "\(.name)\t\(.conclusion)"')"
          echo "$jobs"
          satisfied=""
          for channel in latest nightly; do
            missing=0
            while IFS= read -r job; do
              job="$(printf '%s' "$job" | sed 's/^ *//')"
              [ -n "$job" ] || continue
              row="$(printf '%s\n' "$jobs" | grep -F "$job [$channel]" || true)"
              if [ -z "$row" ]; then
                echo "channel $channel: MISSING $job"
                missing=1
              elif ! printf '%s' "$row" | grep -q "success$"; then
                echo "channel $channel: NOT GREEN $job"
                missing=1
              fi
            done <<< "$expected"
            if [ "$missing" -eq 0 ]; then
              satisfied="$channel"
              break
            fi
          done
          if [ -n "$satisfied" ]; then
            echo "::notice::gate satisfied by the $satisfied channel"
            exit 0
          fi
          echo "::error::no channel passed every gate job; see the per-leg results above"
          exit 1
